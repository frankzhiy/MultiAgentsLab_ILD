# -----------------------------------------------------------------------------
# 中文入院记录 —— 篇章 section 规则库
# -----------------------------------------------------------------------------
# 每条规则会针对每个句子进行匹配。匹配命中即给该句子打上对应 section 标签。
# 同一句子可能命中多条规则，按 priority 取最大值（数字大者优先）。
# 未命中任何规则的句子会被标记为 unknown，由后续 fallback 规则处理：
#   - 若上一句已有标签，则继承（"延续段落"）
#   - 若位于开头，则归入 patient_profile
#
# section_id 必须与 src/schemas/context_chunker/discourse_taxonomy.py 中的常量一致。
# -----------------------------------------------------------------------------

sections:
  - id: patient_profile        # 一般项目（人口学 / 一般健康状况）
    priority: 50
    patterns:
      - regex: '^患者[,，]\s*(男|女)[,，]\s*\d+\s*岁'
      - regex: '一般健康状况[：:]'
      - regex: '(职业|文化程度|婚姻|籍贯)[：:]'

  - id: chief_complaint        # 主诉
    priority: 90
    patterns:
      - regex: '主因[“"《].*?[”"》].*?(入院|就诊|来诊)'
      - regex: '主诉[：:]'

  - id: relevant_history       # 既往史 / 个人史 / 家族史 / 手术史
    priority: 80
    patterns:
      # 既往疾病 / 既往用药 / 既往健康
      - regex: '^既往'
      - regex: '既往.{0,8}(史|健康|体健|疾病|用药)'
      # 手术 / 外伤史（"40 年前左下肢骨折固定术" 这类）
      - regex: '\d+\s*(年|月)前.{0,15}(术|外伤|骨折|手术)'
      # 显式标题
      - regex: '(个人史|家族史|婚育史|月经史|过敏史|手术史)[：:]'
      # 暴露史
      - regex: '(吸烟|饮酒|粉尘|霉菌|鸟类|职业暴露)史'

  - id: present_illness        # 现病史
    priority: 85
    patterns:
      # "患者于 X 年/月/天前 ... 出现 ..."
      - regex: '患者(于|自)?\s*\d+\s*(年|月|天|周|小时)前'
      # "X 年/月/天前 ... 出现 / 反复 / 加重"
      - regex: '\d+\s*(年|月|天|周|小时)前.{0,20}(出现|反复|加重|发作|起病|无明显诱因)'
      # 现病史标题
      - regex: '现病史[：:]'
      # 病程描述句
      - regex: '^病程中'
      # "X 月前再次出现..."
      - regex: '\d+\s*(月|天|年|周)前.{0,8}再次'

  - id: auxiliary_exam         # 辅助检查
    priority: 95
    patterns:
      - regex: '入院后.{0,8}(完善|查|行|进行).*?检查'
      - regex: '辅助检查[：:]'
      - regex: '^(胸部CT|肺部CT|HRCT|胸片|X线)'
      - regex: '^(血常规|生化|肝功|肾功|血气|凝血|D[-－]?二聚体|D2聚体|血沉|CRP)'
      - regex: '^(肺功能|通气功能|换气功能|脉冲振荡)'
      - regex: '^(支气管镜|BALF|病理|结核.*T细胞)'
      - regex: '^[A-Z]?\d+[\.、]\s*(通气|换气|脉冲|弥散)'

  - id: physical_exam          # 体格检查
    priority: 85
    patterns:
      - regex: '入院查体[：:]'
      - regex: '体格检查[：:]'
      - regex: '查体[：:]'

  - id: initial_diagnosis      # 初步诊断 / 入院诊断
    priority: 85
    patterns:
      - regex: '入院诊断[：:]'
      - regex: '初步诊断[：:]'
      - regex: '门诊诊断[：:]'

  - id: management_plan        # 诊疗计划
    priority: 80
    patterns:
      - regex: '诊疗?(计划|方案)[：:]'
      - regex: '(拟|计划|建议).*?(完善|复查|随访|会诊|出院)'

# -----------------------------------------------------------------------------
# 未命中时的默认行为
# -----------------------------------------------------------------------------
fallback:
  # 第一句未命中时的默认归属
  default_first: patient_profile
  # 其他位置未命中时：继承上一句标签（"句子是段落的延续"）
  inherit_previous: true
