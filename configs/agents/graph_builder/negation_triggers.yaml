# ---------------------------------------------------------------------------
# 否定辖域识别规则词典
# ---------------------------------------------------------------------------
# 被 clinical_context_preprocessor 使用，语言无关的 NegEx/ConText 中文实现。
# ---------------------------------------------------------------------------

# 否定触发词：出现在实体前，表示否定
negation_triggers:
  - 无
  - 未
  - 未见
  - 未诉
  - 未及
  - 未发现
  - 否认
  - 不伴
  - 无明显
  - 未予
  - 未行
  - 未查
  - 未复查
  - 无法
  - 不能

# 辖域终止符：遇到这些词时，否定辖域结束
# 用于列举式否定（"无A、B、C等不适"）的辖域右边界
scope_right_terminators:
  - 等不适
  - 等症状
  - 等情况
  - 等阳性体征
  - 等异常
  - 等

# 辖域截断词：出现时"前面的否定"不再延伸到后面
# 例如："无发热，但有咳嗽" → 咳嗽不被否定
scope_breakers:
  - 但
  - 但是
  - 然而
  - 除
  - 除外
  - 除此之外
  - 反而
  - 却

# 列举分隔符：在列举式否定中，用于切分被否定的子项
list_separators:
  - "、"
  - "，"
  - ","

# 句子边界（辖域不跨越这些边界）
sentence_boundaries:
  - "。"
  - "；"
  - "!"
  - "？"
  - "\n"
